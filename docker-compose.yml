version: '3.8'

services:
  # 1. Python AI & ML Intelligence Engine
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: synaptech-ai-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. React SPA Frontend (Serverless Firebase)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synaptech-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      ai-service:
        condition: service_healthy

