version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: snaptech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snaptechdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snaptechdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python AI & ML Intelligence Engine
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: snaptech-ai-engine
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Spring Boot 3 Core Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snaptech-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/snaptechdb
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - AI_SERVICE_URL=http://ai-service:5000
      - APP_JWT_SECRET=snaptechSecretKeyForSnaptechSoftwareEngineeringPlatform1234567890!
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  # 4. React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snaptech-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
