server.port=${PORT:8081}

# Database Configuration (Defaults to persistent H2, overrides with PostgreSQL in container/production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/snaptechdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration (HS512 requires >= 64 characters)
app.jwt.secret=${APP_JWT_SECRET:snaptechSecretKeyForSnaptechSoftwareEngineeringPlatform1234567890!}

# AI Microservice URL (FastAPI running on port 5000)
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
