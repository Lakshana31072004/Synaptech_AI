server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:aseosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration (HS512 requires >= 64 characters)
app.jwt.secret=aseosSecretKeyForAutonomousSoftwareEngineeringOperatingSystemPlatform1234567890!

# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

