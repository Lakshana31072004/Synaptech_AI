# Isolated in-memory H2 database configuration for unit & integration test suites
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Test Secret (>= 64 chars)
app.jwt.secret=snaptechSecretKeyForSnaptechSoftwareEngineeringPlatform1234567890!

# AI Microservice URL mock/fallback for test environment
ai.service.url=http://localhost:5000
