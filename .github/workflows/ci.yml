name: Synaptech AI Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-test:
    name: Frontend Test Suite (React 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run React Unit Tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false

      - name: Build React Production Bundle
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false

  ai-service-validation:
    name: AI Microservice & ML Validation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        working-directory: ./ai-services
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Unit Tests
        working-directory: ./ai-services
        run: pytest tests/test_ai_engine.py
